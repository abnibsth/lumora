name: backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# A newer push to the same ref cancels the run in progress: the last commit is
# the only one worth testing.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: lint, vet, build, unit, race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # gofmt -l exits 0 even when it lists files, so the output is checked
      # explicitly rather than trusted as an exit code.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit tests
        run: go test ./... -count=1
      # ubuntu-latest ships gcc, so -race runs natively here even though the
      # Windows dev host has to fall back to a golang container.
      - name: race detector
        run: go test -race ./... -count=1

  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumora
          POSTGRES_PASSWORD: lumora
          POSTGRES_DB: lumora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumora -d lumora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      AI_PROVIDER: stub
      EMAIL_PROVIDER: stub
      DATABASE_URL: postgres://lumora:lumora@localhost:5432/lumora?sslmode=disable
      TEST_DATABASE_URL: postgres://lumora:lumora@localhost:5432/lumora?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # migrate is the hard preflight: if the service is unreachable the job
      # fails here instead of letting the test file's t.Skipf hide it.
      - name: migrate
        run: go run ./cmd/migrate
      - name: seed
        run: go run ./cmd/seed
      - name: integration tests
        run: go test -tags integration ./internal/service -run Integration -v -count=1

  sqlc:
    name: sqlc drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version in the internal/store/*.sql.go headers; a
      # different sqlc could reformat the output and fail the diff below.
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: generate
        run: sqlc generate
      - name: drift
        run: git diff --exit-code -- internal/store
