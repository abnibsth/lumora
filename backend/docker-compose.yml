services:
  postgres:
    image: postgres:16-alpine
    container_name: lumora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumora
      POSTGRES_PASSWORD: lumora
      POSTGRES_DB: lumora
    ports:
      - "5432:5432"
    volumes:
      - lumora-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumora -d lumora"]
      interval: 5s
      timeout: 3s
      retries: 10

  # one-shot: schema (goose) — idempotent, aman dijalankan berulang
  migrate:
    build: &build
      context: .
      dockerfile: Dockerfile
    command: ["/app/migrate"]
    environment: &dbenv
      DATABASE_URL: postgres://lumora:lumora@postgres:5432/lumora?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # one-shot: 9 profil demo — idempotent (slug yang ada dilewati)
  seed:
    build: *build
    command: ["/app/seed"]
    environment: *dbenv
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: *build
    command: ["/app/api"]
    environment:
      DATABASE_URL: postgres://lumora:lumora@postgres:5432/lumora?sslmode=disable
      APP_ENV: development
      UPLOAD_DIR: /app/uploads
      PORT: "8080"
      # Offline by default so the demo stack needs no credentials. Export
      # AI_PROVIDER=gemini and GEMINI_API_KEY to run against the real provider.
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Per-account draft quota. Bump it while developing so the local stack
      # does not answer 429.
      AI_DRAFT_LIMIT_PER_HOUR: ${AI_DRAFT_LIMIT_PER_HOUR:-20}
      # Global ceiling across all accounts. Lower it (e.g. 3) to exercise the
      # global 429 locally without spending 200 requests.
      AI_DRAFT_GLOBAL_LIMIT_PER_HOUR: ${AI_DRAFT_GLOBAL_LIMIT_PER_HOUR:-200}
      # Auth limits, keyed by the email in the body rather than by IP. Bump them
      # while developing so repeated login/register attempts do not answer 429.
      AUTH_LOGIN_LIMIT_PER_15_MIN: ${AUTH_LOGIN_LIMIT_PER_15_MIN:-10}
      AUTH_REGISTER_LIMIT_PER_HOUR: ${AUTH_REGISTER_LIMIT_PER_HOUR:-10}
      AUTH_LOGIN_GLOBAL_LIMIT_PER_HOUR: ${AUTH_LOGIN_GLOBAL_LIMIT_PER_HOUR:-300}
      AUTH_REGISTER_GLOBAL_LIMIT_PER_HOUR: ${AUTH_REGISTER_GLOBAL_LIMIT_PER_HOUR:-30}
    ports:
      - "8080:8080"
    volumes:
      - lumora-uploads:/app/uploads
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  lumora-pgdata:
  lumora-uploads:
